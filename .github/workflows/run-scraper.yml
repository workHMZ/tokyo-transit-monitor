# =============================================================================
# 定期スクレイピング + Synology Chat 通知 + GitHub Pages 更新
# =============================================================================
# トリガー: 毎日 7:30, 12:00, 17:30 (JST) 自動実行 または 手動トリガー
# 機能: 東京圏の運行情報を取得し、Synology Chatへ通知 & GitHub Pagesを更新
# =============================================================================

name: 🚃 Run Scraper (7:30AM, 12PM & 5:30PM JST)

on:
  # 【重要】cron は UTC で書き、timezone キーは使わないこと。
  #
  # GitHub Actions の `timezone:` は 2026-03 に Public Preview として追加されたが、
  # 2026-08-27 昼(UTC)を境に本リポジトリでは適用されなくなり、
  # cron が UTC として解釈されるようになった（= 定時実行が JST 16:30/21:00/02:30 にずれ、
  # 12:00 JST の実行が消失）。同一コミット・同一ファイルのまま挙動が変わったため、
  # プレビュー機能には依存せず、UTC で明示的に書く方式に戻している。
  #
  # JST = UTC + 9。GitHub 側のスケジューラ遅延(通常 20〜50分)を見込み、
  # V1 と同じく目標時刻の15分前に設定している。
  schedule:
    - cron: '15 22 * * *'  # 目標 7:30 JST  (= 前日 22:30 UTC の15分前)
    - cron: '45 2 * * *'   # 目標 12:00 JST (= 当日 03:00 UTC の15分前)
    - cron: '15 8 * * *'   # 目標 17:30 JST (= 当日 08:30 UTC の15分前)
  
  workflow_dispatch:
    inputs:
      send_notification:
        description: 'Send notification to Synology Chat? (Synology Chatへ通知を送信しますか？)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tokyo-transit-pages
  cancel-in-progress: false

jobs:
  run-scraper:
    name: 🚀 Run Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: 🧪 Run parser tests
        run: |
          echo "=========================================="
          echo "🧪 パーサーの回帰テストを実行中..."
          echo "=========================================="

          uv run --with-requirements requirements.txt --with pytest \
            python -m pytest tests/ -q

      - name: 🚀 Run Scraper
        id: scraper
        run: |
          echo "=========================================="
          echo "🚃 運行情報スクレイパーを実行中..."
          echo "=========================================="
          
          uv run --with-requirements requirements.txt app.py

      # 【意図的な仕様】通知は手動実行 (workflow_dispatch) のときだけ送る。
      # 定時実行のたびに通知すると毎日3回届いて煩わしいため、
      # 日常の確認は Web ダッシュボードで行う方針。バグではないので直さないこと。
      - name: 📤 Send Notification to Synology Chat
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_notification == 'true' }}
        env:
          SYNOLOGY_WEBHOOK: ${{ secrets.SYNOLOGY_CHAT_WEBHOOK }}
        run: |
          echo "=========================================="
          echo "📤 Synology Chat へ通知を送信中..."
          echo "=========================================="

          # JSONファイルの存在と妥当性を確認
          if [ ! -f transit_data.json ] || ! jq empty transit_data.json 2>/dev/null; then
            echo "❌ transit_data.json が存在しないか無効です。通知をスキップします。"
            exit 0
          fi

          # Webhook URLの引用符や%22を整形
          WEBHOOK_URL="${SYNOLOGY_WEBHOOK%\"}"
          WEBHOOK_URL="${WEBHOOK_URL#\"}"
          WEBHOOK_URL=$(echo "$WEBHOOK_URL" | sed 's/token=%22/token=/g; s/%22$//g; s/token="/token=/g; s/"$//g')

          # jq を使用してフォーマット済みメッセージを構築
          MESSAGE=$(jq -r '
            def format_detail:
              if length > 120 then
                sub("\\.\\.\\.$"; "") | .[0:120] + "…"
              else
                .
              end;

            if .status == "all_clear" or .issue_count == 0 then
              "✅ 【東京交通情報】全線正常運転中！\n\n🕐 更新時間: \(.update_time // "Unknown") (JST)\n\n🔗 詳細: <https://workhmz.github.io/tokyo-transit-monitor/|Tokyo Transit Monitor>"
            else
              (
                "⚠️ 【東京交通情報】\(.issue_count)件の運行情報\n\n🕐 更新: \(.update_time // "Unknown") (JST)\n\n" +
                (
                  .issues[:5] | map(
                    "• " + (if .status != "" and .status != null then "[\(.status)] " else "" end) + "\(.line): \(.detail | format_detail)"
                  ) | join("\n")
                ) +
                (if (.issue_count // 0) > 5 then "\n  ...他 \((.issue_count // 0) - 5) 件の運行情報" else "" end) +
                "\n\n🔗 詳細: <https://workhmz.github.io/tokyo-transit-monitor/|Tokyo Transit Monitor>"
              )
            end
          ' transit_data.json)

          echo "=========================================="
          echo "📋 送信メッセージ内容プレビュー:"
          echo "=========================================="
          printf '%s\n' "$MESSAGE"
          echo "=========================================="

          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️ SYNOLOGY_WEBHOOK が未設定のため、送信をスキップします。"
            exit 0
          fi

          # JSON payloadの構築
          PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text}')

          # Synology Chat Incoming Webhook へPOST送信
          curl --fail-with-body -sS \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "payload=$PAYLOAD"

          echo ""
          echo "✅ Synology Chat 通知の送信が完了しました。"

      - name: 📦 Prepare Pages
        run: |
          mkdir -p _site
          cp index.html transit_data.json apple-touch-icon.png _site/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy-pages:
    name: 🌐 Deploy to GitHub Pages
    needs: run-scraper
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
