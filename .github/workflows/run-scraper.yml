# =============================================================================
# 定期スクレイピング + Synology Chat 通知 + GitHub Pages 更新
# =============================================================================
# トリガー: 毎日 7:30, 12:00, 17:30 (JST) 前後を目標に自動実行 または 手動トリガー
# 機能: 東京圏の運行情報を取得し、Synology Chatへ通知 & GitHub Pagesを更新
# =============================================================================

name: 🚃 Run Scraper (Target 7:30AM, 12PM & 5:30PM JST)

on:
  # 【重要】cron は UTC で明示し、GitHub Actions のキュー遅延を見込んで前倒し設定する。
  #
  # JST = UTC + 9。2026年後半以降、公開リポジトリの `on: schedule` には
  # 数時間規模のキュー遅延が日常的に発生するため、毎正時・15分刻みの混雑帯を避けつつ
  # 目標時刻（7:30 / 12:00 / 17:30 JST）の約 2〜2.5 時間前に発火させている。
  # 朝枠は遅延ゼロで即実行された場合でも始発後の運行情報を拾える 5:07 JST 以降とする。
  # 変更時は index.html の SCHEDULE_UTC も必ず揃えること。
  schedule:
    - cron: '7 20 * * *'   # 05:07 JST 発火 -> 目標 07:30 JST 前後 (= 前日 20:07 UTC)
    - cron: '19 0 * * *'   # 09:19 JST 発火 -> 目標 12:00 JST 前後 (= 当日 00:19 UTC)
    - cron: '49 5 * * *'   # 14:49 JST 発火 -> 目標 17:30 JST 前後 (= 当日 05:49 UTC)
  
  workflow_dispatch:
    inputs:
      send_notification:
        description: 'Send notification to Synology Chat? (Synology Chatへ通知を送信しますか？)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tokyo-transit-pages
  cancel-in-progress: false

jobs:
  run-scraper:
    name: 🚀 Run Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.13'
          enable-cache: true

      - name: 🧪 Run parser tests
        run: |
          echo "=========================================="
          echo "🧪 パーサーの回帰テストを実行中..."
          echo "=========================================="

          uv run --with-requirements requirements.txt --with pytest==9.2.0 \
            python -m pytest tests/ -q

      - name: 🚀 Run Scraper
        id: scraper
        run: |
          echo "=========================================="
          echo "🚃 運行情報スクレイパーを実行中..."
          echo "=========================================="
          
          uv run --with-requirements requirements.txt app.py

      # 【意図的な仕様】通知は手動実行 (workflow_dispatch) のときだけ送る。
      # 定時実行のたびに通知すると毎日3回届いて煩わしいため、
      # 日常の確認は Web ダッシュボードで行う方針。バグではないので直さないこと。
      - name: 📤 Send Notification to Synology Chat
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_notification == 'true' }}
        env:
          SYNOLOGY_WEBHOOK: ${{ secrets.SYNOLOGY_CHAT_WEBHOOK }}
        run: |
          echo "=========================================="
          echo "📤 Synology Chat へ通知を送信中..."
          echo "=========================================="

          # JSONファイルの存在と妥当性を確認
          if [ ! -f transit_data.json ] || ! jq empty transit_data.json 2>/dev/null; then
            echo "❌ transit_data.json が存在しないか無効です。通知をスキップします。"
            exit 0
          fi

          # Webhook URLの引用符や%22を整形（変形後の文字列も公開ログに出ないようマスク登録）
          WEBHOOK_URL="${SYNOLOGY_WEBHOOK%\"}"
          WEBHOOK_URL="${WEBHOOK_URL#\"}"
          WEBHOOK_URL=$(printf '%s' "$WEBHOOK_URL" | sed 's/token=%22/token=/g; s/%22$//g; s/token="/token=/g; s/"$//g')
          if [ -n "$WEBHOOK_URL" ]; then
            echo "::add-mask::$WEBHOOK_URL"
          fi

          # jq を使用してフォーマット済みメッセージを構築
          MESSAGE=$(jq -r '
            def format_detail:
              if length > 120 then
                sub("\\.\\.\\.$"; "") | .[0:120] + "…"
              else
                .
              end;

            def unmatched_note:
              if ((.unmatched_lines // []) | length) > 0 then
                "\n\nℹ️ Yahoo!上で未確認の監視対象路線: " + ((.unmatched_lines // []) | join("、"))
              else
                ""
              end;

            if .status == "all_clear" or .issue_count == 0 then
              "✅ 【東京交通情報】全線正常運転中！\n\n🕐 更新時間: \(.update_time // "Unknown") (JST)" +
              unmatched_note +
              "\n\n🔗 詳細: <https://workhmz.github.io/tokyo-transit-monitor/|Tokyo Transit Monitor>"
            else
              (
                "⚠️ 【東京交通情報】\(.issue_count)件の運行情報\n\n🕐 更新: \(.update_time // "Unknown") (JST)\n\n" +
                (
                  .issues[:5] | map(
                    "• " + (if .status != "" and .status != null then "[\(.status)] " else "" end) + "\(.line): \(.detail | format_detail)"
                  ) | join("\n")
                ) +
                (if (.issue_count // 0) > 5 then "\n  ...他 \((.issue_count // 0) - 5) 件の運行情報" else "" end) +
                unmatched_note +
                "\n\n🔗 詳細: <https://workhmz.github.io/tokyo-transit-monitor/|Tokyo Transit Monitor>"
              )
            end
          ' transit_data.json)

          echo "=========================================="
          echo "📋 送信メッセージ内容プレビュー:"
          echo "=========================================="
          printf '%s\n' "$MESSAGE"
          echo "=========================================="

          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️ SYNOLOGY_WEBHOOK が未設定のため、送信をスキップします。"
            exit 0
          fi

          # JSON payloadの構築
          PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text}')

          # Synology Chat Incoming Webhook へPOST送信（通知失敗でも Pages 更新は止めない）
          if curl --fail-with-body -sS \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "payload=$PAYLOAD"; then
            echo ""
            echo "✅ Synology Chat 通知の送信が完了しました。"
          else
            echo ""
            echo "::warning::Synology Chat への通知送信に失敗しました（Pages の更新は続行します）。"
          fi

      - name: 📦 Prepare Pages
        run: |
          mkdir -p _site
          cp index.html transit_data.json apple-touch-icon.png _site/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy-pages:
    name: 🌐 Deploy to GitHub Pages
    needs: run-scraper
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pages API occasionally returns transient 5xx on "create deployment"
      # (e.g. run 45651266133). Retry once after a short wait instead of
      # leaving the dashboard stale until the next scheduled run.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::Pages deployment failed on first attempt; retrying in 60s."
          sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
