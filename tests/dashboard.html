<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Transit dashboard regression tests</title>
    <style>
        body { font: 14px system-ui; margin: 24px; }
        iframe { width: 390px; height: 600px; border: 1px solid #ccc; }
        pre { white-space: pre-wrap; }
    </style>
</head>
<body>
<h1>Transit dashboard regression tests</h1>
<pre id="results">Running…</pre>
<script>
(async () => {
    const source = await (await fetch('../index.html')).text();
    const data = {
        update_time: '2026-09-26 07:30:00', update_time_iso: '2026-09-26T07:30:00+09:00',
        issue_count: 3, monitored_lines_count: 52, status: 'issues_found', unmatched_lines: [],
        issues: ['中央総武線(各停)', '東京メトロ千代田線', '西武池袋線・秩父線'].map((line, i) => ({
            line, status: ['列車遅延', '運転見合わせ', '運転再開'][i],
            detail: '信号関係点検の影響で、一部列車に遅れが出ています。'.repeat(8),
            url: 'https://transit.yahoo.co.jp/diainfo/40/0',
        })),
    };
    const results = [];
    const metrics = [];
    const assert = (value, message) => { if (!value) throw new Error(message); };
    const tick = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const settle = async () => { for (let i = 0; i < 8; i++) await Promise.resolve(); };
    async function test(name, run) {
        const frame = document.createElement('iframe');
        const bootstrap = `window.fetch = async () => new Response(${JSON.stringify(JSON.stringify(data))});`;
        const loaded = new Promise(resolve => { frame.onload = resolve; });
        frame.srcdoc = source.replace('<script>', '<script>' + bootstrap + '</scr' + 'ipt><script>');
        document.body.append(frame);
        try {
            await loaded;
            const w = frame.contentWindow;
            for (let i = 0; i < 100 && !w.eval('lastData'); i++) {
                await new Promise(resolve => setTimeout(resolve, 10));
            }
            assert(w.eval('lastData'), 'Initial fixture did not load');
            await run(w, frame.contentDocument, frame);
            results.push({ name, passed: true });
        } catch (error) {
            results.push({ name, passed: false, error: error.message });
        } finally {
            frame.remove();
            document.body.style.backgroundColor = '';
            document.getElementById('results').textContent = JSON.stringify(results, null, 2);
        }
    }
    await test('stale warning survives the next schedule and overnight grace', (w, d) => {
        const OriginalDate = w.Date;
        const cases = [
            ['2026-09-26T08:44:59+09:00', '2026-09-25T17:30:00+09:00', false],
            ['2026-09-26T08:45:00+09:00', '2026-09-25T17:30:00+09:00', true],
            ['2026-09-26T11:40:00+09:00', '2026-09-25T17:30:00+09:00', true],
            ['2026-09-26T11:46:00+09:00', '2026-09-25T17:30:00+09:00', true],
            ['2026-09-26T13:16:00+09:00', '2026-09-25T17:30:00+09:00', true],
            ['2026-09-26T11:46:00+09:00', '2026-09-26T07:30:00+09:00', false],
            ['2026-09-26T13:16:00+09:00', '2026-09-26T12:00:00+09:00', false],
        ];
        for (const [now, updated, expected] of cases) {
            w.Date = class extends OriginalDate {
                constructor(...args) { super(...(args.length ? args : [now])); }
            };
            w.render({ ...data, update_time_iso: updated });
            assert(d.getElementById('staleBanner').classList.contains('visible') === expected, now);
        }
        w.Date = OriginalDate;
    });
    await test('unchanged data retains the focused DOM node', (w, d) => {
        const button = d.querySelector('.line-header');
        button.focus();
        w.render({ ...data, update_time: '2026-09-26 07:35:00' });
        assert(d.activeElement === button && button.isConnected, 'Unchanged card was replaced');
    });
    await test('changed and reordered data retains expanded link focus', (w, d) => {
        d.querySelector('.line-header').click();
        d.querySelector('.line-link').focus();
        const issues = [...data.issues].reverse().map(issue => ({ ...issue, detail: issue.detail + '更新' }));
        w.render({ ...data, issues });
        assert(d.activeElement.matches('.line-link'), 'Link focus lost');
        assert(d.activeElement.closest('.line-item').dataset.line === data.issues[0].line, 'Wrong focused line');
        assert(d.activeElement.closest('.line-item').classList.contains('expanded'), 'Expanded state lost');
    });
    await test('removed focused line falls back without stealing external focus', (w, d) => {
        d.querySelector('.line-header').focus();
        w.render({ ...data, issue_count: 2, issues: data.issues.slice(1) });
        assert(d.activeElement.closest('.line-item')?.dataset.line === data.issues[1].line, 'Missing fallback');
        w.render({ ...data, issue_count: 0, status: 'all_clear', issues: [] });
        assert(d.activeElement.id === 'content', 'All-clear focus lost');
        const footer = d.querySelector('.footer a');
        footer.focus();
        w.render(data);
        assert(d.activeElement === footer, 'External focus stolen');
    });
    await test('hung requests time out, retain data, and permit retry', async (w, d) => {
        const originalFetch = w.fetch;
        const originalTimeout = w.setTimeout;
        let timeout, signal;
        w.setTimeout = (fn, ms) => { assert(ms === 15000, 'Unexpected timeout'); timeout = fn; return 999999; };
        w.fetch = (url, options) => new Promise((resolve, reject) => {
            signal = options?.signal;
            signal?.addEventListener('abort', () => reject(new w.DOMException('Aborted', 'AbortError')));
        });
        const oldContent = d.getElementById('content').innerHTML;
        const request = w.loadTransitData();
        assert(signal, 'No cancellation signal');
        assert(timeout, 'No application timeout');
        timeout();
        await request;
        assert(signal.aborted, 'Request not aborted');
        assert(d.getElementById('content').innerHTML === oldContent, 'Last good data removed');
        assert(d.getElementById('fetchErrorNotice').classList.contains('visible'), 'No failure notice');
        w.fetch = originalFetch;
        w.setTimeout = originalTimeout;
        await w.loadTransitData();
        assert(!d.getElementById('fetchErrorNotice').classList.contains('visible'), 'Retry did not recover');
    });
    await test('timeout covers response body parsing and initial failure', async (w, d) => {
        w.eval('lastData = null');
        let timeout;
        w.setTimeout = fn => { timeout = fn; return 999999; };
        w.fetch = async (url, { signal }) => ({ ok: true, json: () => new Promise((resolve, reject) => {
            signal.addEventListener('abort', () => reject(new w.DOMException('Aborted', 'AbortError')));
        }) });
        const request = w.loadTransitData();
        await settle();
        assert(timeout, 'No timeout for response body');
        timeout();
        await request;
        assert(d.querySelector('.error-message').textContent.includes('タイムアウト'), 'No timeout message');
        assert(d.getElementById('updateTime').textContent === '取得失敗', 'Header still loading');
    });
    await test('resume replaces expired request and ignores its late completion', async (w, d) => {
        const OriginalDate = w.Date;
        let calls = 0, releaseOld, oldSignal;
        w.setTimeout = () => 999999;
        w.fetch = (url, { signal }) => {
            calls++;
            if (calls === 1) {
                oldSignal = signal;
                return new Promise(resolve => { releaseOld = resolve; });
            }
            return Promise.resolve(new w.Response(JSON.stringify({ ...data, update_time: 'new result' })));
        };
        const first = w.loadTransitData();
        await w.loadTransitData();
        assert(calls === 1, 'Concurrent requests were not deduplicated');
        w.Date = class extends OriginalDate { static now() { return OriginalDate.now() + 16000; } };
        await w.loadTransitData();
        assert(calls === 2 && oldSignal.aborted, 'Expired request blocked resume');
        releaseOld(new w.Response(JSON.stringify({ ...data, update_time: 'old result' })));
        await first;
        assert(d.getElementById('fetchTime').textContent === 'new result', 'Late result overwrote new data');
        assert(!d.getElementById('fetchErrorNotice').classList.contains('visible'), 'Late failure overwrote success');
        w.Date = OriginalDate;
    });
    await test('light and dark text contrast meets 4.5 to 1', async (w, d) => {
        const luminance = rgb => {
            const values = rgb.match(/[\d.]+/g).slice(0, 3).map(n => {
                n = Number(n) / 255;
                return n <= 0.04045 ? n / 12.92 : ((n + 0.055) / 1.055) ** 2.4;
            });
            return values[0] * 0.2126 + values[1] * 0.7152 + values[2] * 0.0722;
        };
        d.querySelector('.line-header').click();
        w.setNotice('fetchErrorNotice', 'Network warning');
        for (const theme of ['light', 'dark']) {
            document.body.style.backgroundColor = theme === 'light' ? '#fff' : '#17171c';
            w.detectAndApplyTheme();
            await tick();
            await Promise.all(d.getAnimations().map(animation => animation.finished.catch(() => {})));
            assert(d.body.className === theme + '-theme', 'Unexpected active theme');
            for (const selector of ['.header-status', '.data-info', '.footer', '.line-link', '.line-detail', '.status-success', '.status-danger', '.notice.visible']) {
                const el = d.querySelector(selector);
                let parent = el, bg;
                while (parent) {
                    bg = w.getComputedStyle(parent).backgroundColor;
                    if (bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') break;
                    parent = parent.parentElement;
                }
                const a = luminance(w.getComputedStyle(el).color), b = luminance(bg);
                const ratio = (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
                metrics.push({ theme, selector, contrast: Number(ratio.toFixed(2)) });
                assert(ratio >= 4.5, `${theme} ${selector}: ${ratio.toFixed(2)}`);
            }
        }
    });
    await test('narrow layouts and document scrolling remain usable', async (w, d, frame) => {
        for (const width of [320, 375, 390, 430, 844, 1440]) {
            frame.style.width = width + 'px';
            await tick();
            assert(d.documentElement.scrollWidth <= d.documentElement.clientWidth + 1, `Overflow at ${width}`);
        }
        frame.style.width = '390px';
        w.render({ ...data, issue_count: 24, issues: Array.from({ length: 24 }, (_, i) => ({ ...data.issues[i % 3], line: 'Line ' + i })) });
        w.scrollTo(0, 300);
        await tick();
        assert(w.scrollY > 0 && d.scrollingElement === d.documentElement, 'Document not scrolling');
        assert(Math.abs(d.querySelector('.header').getBoundingClientRect().top) < 1, 'Sticky header moved');
    });
    window.testResults = { passed: results.filter(r => r.passed).length, failed: results.filter(r => !r.passed).length, userAgent: navigator.userAgent, results, metrics };
    document.getElementById('results').textContent = JSON.stringify(window.testResults, null, 2);
    document.title = `${window.testResults.failed ? 'FAIL' : 'PASS'}: Transit dashboard tests`;
})().catch(error => {
    window.testResults = { failed: 1, error: error.stack };
    document.getElementById('results').textContent = error.stack;
});
</script>
</body>
</html>
