<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <meta name="apple-mobile-web-app-title" content="東京交通情報">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="apple-touch-icon.png">
    <title>東京交通情報 - Glance</title>
    <style>
        :root {
            --color-background: hsl(240, 8%, 9%);
            --color-widget-background: hsl(240, 8%, 10%);
            --color-widget-background-highlight: hsl(240, 8%, 14%);
            --color-separator: hsl(240, 8%, 13%);
            --color-widget-content-border: hsl(240, 8%, 13%);
            --color-primary: hsl(43, 50%, 70%);
            --color-link: hsl(43, 50%, 70%);
            --color-notice: hsl(38, 90%, 65%);
            --color-success-text: #000;
            --color-text-highlight: hsl(240, 8%, 85%);
            --color-text-base: hsl(240, 8%, 58%);
            --color-text-subdue: hsl(240, 8%, 58%);
            --color-success: hsl(142, 50%, 45%);
            --color-warning: hsl(38, 90%, 55%);
            --color-error: hsl(0, 70%, 48%);
            --border-radius: 5px;
            --font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --color-background: hsl(0, 0%, 98%);
                --color-widget-background: hsl(0, 0%, 100%);
                --color-widget-background-highlight: hsl(0, 0%, 96%);
                --color-separator: hsl(0, 0%, 90%);
                --color-widget-content-border: hsl(0, 0%, 85%);
                --color-primary: hsl(43, 70%, 55%);
                --color-link: hsl(38, 90%, 28%);
                --color-notice: hsl(38, 90%, 28%);
                --color-success-text: #fff;
                --color-text-highlight: hsl(0, 0%, 10%);
                --color-text-base: hsl(0, 0%, 40%);
                --color-text-subdue: hsl(0, 0%, 40%);
                --color-success: hsl(142, 60%, 30%);
                --color-warning: hsl(38, 80%, 45%);
                --color-error: hsl(0, 65%, 50%);
            }
        }

        body.light-theme {
            --color-background: hsl(0, 0%, 98%);
            --color-widget-background: hsl(0, 0%, 100%);
            --color-widget-background-highlight: hsl(0, 0%, 96%);
            --color-separator: hsl(0, 0%, 90%);
            --color-widget-content-border: hsl(0, 0%, 85%);
            --color-primary: hsl(43, 70%, 55%);
            --color-link: hsl(38, 90%, 28%);
            --color-notice: hsl(38, 90%, 28%);
            --color-success-text: #fff;
            --color-text-highlight: hsl(0, 0%, 10%);
            --color-text-base: hsl(0, 0%, 40%);
            --color-text-subdue: hsl(0, 0%, 40%);
            --color-success: hsl(142, 60%, 30%);
            --color-warning: hsl(38, 80%, 45%);
            --color-error: hsl(0, 65%, 50%);
        }

        body.dark-theme {
            --color-background: hsl(240, 8%, 9%);
            --color-widget-background: hsl(240, 8%, 10%);
            --color-widget-background-highlight: hsl(240, 8%, 14%);
            --color-separator: hsl(240, 8%, 13%);
            --color-widget-content-border: hsl(240, 8%, 13%);
            --color-primary: hsl(43, 50%, 70%);
            --color-link: hsl(43, 50%, 70%);
            --color-notice: hsl(38, 90%, 65%);
            --color-success-text: #000;
            --color-text-highlight: hsl(240, 8%, 85%);
            --color-text-base: hsl(240, 8%, 58%);
            --color-text-subdue: hsl(240, 8%, 58%);
            --color-success: hsl(142, 50%, 45%);
            --color-warning: hsl(38, 90%, 55%);
            --color-error: hsl(0, 70%, 48%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /*
         * html/body に height: 100% + overflow-x: hidden を付けると body が内側の
         * スクロールコンテナになり、iOS Safari でツールバーの自動縮小や
         * ステータスバータップでのトップ復帰が効かなくなる。文書自体をスクロールさせる。
         */
        html {
            /* iOS Safari の横向き時の文字自動拡大を抑止 */
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--color-background);
            color: var(--color-text-base);
            font-size: 13px;
            line-height: 1.5;
        }

        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            /* viewport-fit=cover 時、横向きのノッチ/角丸に内容が掛からないように */
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            background-color: var(--color-widget-background);
        }

        .header {
            padding: calc(0.75rem + env(safe-area-inset-top, 0px)) 1rem 0.75rem;
            border-bottom: 1px solid var(--color-widget-content-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--color-widget-background);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-highlight);
            font-weight: 600;
            font-size: 14px;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 11px;
            color: var(--color-text-subdue);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--color-success);
        }

        .status-dot.has-issues {
            background-color: var(--color-warning);
        }

        .data-info {
            padding: 0.4rem 1rem;
            background-color: var(--color-widget-background-highlight);
            border-bottom: 1px solid var(--color-separator);
            font-size: 11px;
            color: var(--color-text-subdue);
        }

        .content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .content:focus {
            outline: none;
        }

        .status-summary {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            background-color: var(--color-widget-background-highlight);
            border-radius: var(--border-radius);
            border-left: 3px solid var(--color-success);
        }

        .status-summary.has-issues {
            border-left-color: var(--color-warning);
        }

        .summary-text {
            color: var(--color-text-highlight);
            font-weight: 500;
        }

        .line-list {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .line-item {
            padding: 0.6rem 0.75rem;
            background-color: var(--color-widget-background-highlight);
            border-radius: var(--border-radius);
            border: 1px solid var(--color-separator);
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        /* タッチ端末ではタップ後に :hover が残り続けるため、ホバー可能な環境に限定 */
        @media (hover: hover) {
            .line-item:hover {
                border-color: var(--color-primary);
                background-color: var(--color-widget-background);
            }
        }

        /* 開閉トグル。キーボード / VoiceOver で操作できるよう <button> にしている */
        .line-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            margin: 0 0 0.25rem;
            padding: 0;
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .line-header:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
            border-radius: 3px;
        }

        .line-icon {
            font-size: 12px;
        }

        .line-name {
            color: var(--color-text-highlight);
            font-weight: 500;
            font-size: 12px;
            flex-grow: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .line-status {
            font-size: 10px;
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            font-weight: 500;
            letter-spacing: 0.02em;
            /* 320px 幅などで「運転見合わせ」が2行に割れないように */
            white-space: nowrap;
            flex-shrink: 0;
        }

        .line-status.status-warning {
            background-color: var(--color-warning);
            color: #000;
        }

        .line-status.status-danger {
            background-color: var(--color-error);
            color: #fff;
        }

        .line-status.status-success {
            background-color: var(--color-success);
            color: var(--color-success-text);
        }

        .expand-indicator {
            flex-shrink: 0;
            color: var(--color-text-subdue);
            transition: transform 0.2s ease;
            margin-left: 0.25rem;
        }

        .line-item.expanded .expand-indicator {
            transform: rotate(180deg);
        }

        .line-detail {
            color: var(--color-text-base);
            font-size: 11px;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
        }

        .line-item.expanded .line-detail {
            -webkit-line-clamp: unset;
            overflow: visible;
        }

        .line-footer {
            display: none;
            margin-top: 0.45rem;
            padding-top: 0.4rem;
            border-top: 1px dashed var(--color-separator);
            font-size: 10px;
        }

        .line-item.expanded .line-footer {
            display: flex;
            justify-content: flex-end;
        }

        .line-link {
            color: var(--color-link);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 10px;
        }

        .line-link:hover {
            text-decoration: underline;
        }

        .all-clear {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            color: var(--color-text-subdue);
        }

        .all-clear-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }

        .all-clear-text {
            color: var(--color-success);
            font-weight: 500;
            font-size: 14px;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--color-text-subdue);
        }

        .error-message {
            padding: 1rem;
            margin: 0.5rem;
            background-color: var(--color-widget-background-highlight);
            border-radius: var(--border-radius);
            border-left: 3px solid var(--color-error);
            color: var(--color-text-base);
            font-size: 12px;
        }

        .retry-button {
            margin-top: 0.6rem;
            padding: 0.3rem 0.7rem;
            border: 1px solid var(--color-widget-content-border);
            border-radius: var(--border-radius);
            background-color: var(--color-widget-background);
            color: var(--color-text-highlight);
            font: inherit;
            font-size: 11px;
            cursor: pointer;
        }

        .retry-button:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        .footer {
            padding: 0.5rem 1rem calc(0.5rem + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--color-widget-content-border);
            font-size: 10px;
            color: var(--color-text-subdue);
            text-align: center;
            background-color: var(--color-widget-background);
        }

        .footer a {
            color: var(--color-link);
            text-decoration: none;
        }

        .notice {
            display: none;
            margin: 0.5rem 0.5rem 0;
            padding: 0.5rem 0.7rem;
            border: 1px solid var(--color-warning);
            border-radius: var(--border-radius);
            color: var(--color-notice);
            font-size: 11px;
            line-height: 1.5;
        }

        .notice.visible {
            display: block;
        }

        .status-dot.stale {
            background: var(--color-text-subdue) !important;
            animation: none !important;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /*
         * iPhone / iPad など指で操作する端末向け。
         * Glance 埋め込み (デスクトップ) の密度は変えずに、文字とタップ領域だけ広げる。
         */
        @media (pointer: coarse) {
            .header-status,
            .data-info,
            .notice,
            .footer {
                font-size: 12px;
            }

            .line-name {
                font-size: 14px;
            }

            .line-status {
                font-size: 11px;
            }

            .line-detail {
                font-size: 14px;
            }

            .line-link {
                min-height: 44px;
                font-size: 12px;
            }

            .retry-button {
                min-height: 40px;
                padding: 0.4rem 0.9rem;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-title">
                🚃 東京交通情報
            </div>
            <div class="header-status">
                <span class="status-dot" id="statusDot" aria-hidden="true"></span>
                <span id="updateTime">読み込み中...</span>
            </div>
        </div>
        <div class="data-info" id="dataInfo">
            📅 データ取得: <span id="fetchTime">--</span> (JST)
        </div>

        <div class="notice" id="staleBanner" role="status"></div>
        <div class="notice" id="fetchErrorNotice" role="status"></div>
        <div class="notice" id="unmatchedNotice"></div>

        <div class="content" id="content">
            <div class="loading">読み込み中...</div>
        </div>

        <div class="footer">
            データ: <a href="https://transit.yahoo.co.jp/diainfo/area/4" target="_blank" rel="noopener noreferrer">Yahoo!路線情報</a>
        </div>
    </div>

    <script>
        // Theme detection
        // 優先順: ?theme=light|dark クエリ > 同一オリジン iframe 親背景色 > OS 設定。
        let canReadParent = Boolean(window.parent && window.parent !== window);

        function getForcedTheme(search = window.location.search) {
            const param = new URLSearchParams(search).get('theme');
            return param === 'light' || param === 'dark' ? param : null;
        }

        function detectAndApplyTheme(search = window.location.search) {
            const forced = getForcedTheme(search);
            let isLightTheme = forced
                ? forced === 'light'
                : window.matchMedia('(prefers-color-scheme: light)').matches;

            if (!forced && canReadParent) {
                try {
                    const parentBody = window.parent.document.body;
                    if (parentBody) {
                        const parentBg = window.getComputedStyle(parentBody).backgroundColor;
                        const rgb = parentBg.startsWith('rgb') ? parentBg.match(/[\d.]+/g) : null;
                        // 透明 (alpha 0) の背景からは明暗を判定できないので OS 設定のままにする
                        if (rgb && (rgb.length < 4 || parseFloat(rgb[3]) > 0)) {
                            const brightness = (parseInt(rgb[0]) * 299 + parseInt(rgb[1]) * 587 + parseInt(rgb[2]) * 114) / 1000;
                            isLightTheme = brightness > 127;
                        }
                    }
                } catch (e) {
                    // クロスオリジン iframe（Glance 等）では親を参照できないため以降のポーリングも止める
                    canReadParent = false;
                }
            }
            document.body.className = isLightTheme ? 'light-theme' : 'dark-theme';
            // スクロールバー等の UA 部品もテーマに合わせる（color-scheme はルート要素に効かせる必要がある）
            document.documentElement.style.colorScheme = isLightTheme ? 'light' : 'dark';
        }

        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => detectAndApplyTheme());
        }
        detectAndApplyTheme();

        // 同一オリジンの iframe に埋め込まれ、かつ ?theme= 固定でない場合のみ親テーマを追従
        if (canReadParent && !getForcedTheme()) {
            setInterval(detectAndApplyTheme, 5000);
        }

        // Determine status tag CSS class
        function getStatusClass(status) {
            if (!status) return 'status-warning';
            if (status.includes('見合わせ') || status.includes('運休')) {
                return 'status-danger';
            }
            if (
                status.includes('遅延') ||
                status.includes('運転状況') ||
                status.includes('その他') ||
                status.includes('計画')
            ) {
                return 'status-warning';
            }
            if (status.includes('再開') || status.includes('平常') || status.includes('正常')) {
                return 'status-success';
            }
            return 'status-warning';
        }

        // Data loading
        const DATA_URL = 'transit_data.json';
        const DEFAULT_DETAIL_URL = 'https://transit.yahoo.co.jp/diainfo/area/4';
        const FETCH_TIMEOUT_MS = 15 * 1000;

        // スクレイパーの cron 発火時刻 (UTC)。workflow の schedule と一致させること。
        // 20:07Z = 05:07 JST (目標 07:30 JST)
        // 00:19Z = 09:19 JST (目標 12:00 JST)
        // 05:49Z = 14:49 JST (目標 17:30 JST)
        //
        // GitHub Actions のキュー遅延を見込んで前倒し発火させ、各目標時刻の直前
        // (発火から 135 分後 = 07:22 / 11:34 / 17:04 JST) までに完了していなければ警告する。
        const SCHEDULE_UTC = [[20, 7], [0, 19], [5, 49]];
        const GRACE_MS = 135 * 60 * 1000;

        // 直近の「実行されるはずだった時刻」を UTC で求める。
        // 閲覧者のタイムゾーンに依存しないよう、全て UTC で計算する。
        function lastExpectedRun(now) {
            let latest = null;
            for (const [hour, minute] of SCHEDULE_UTC) {
                for (const dayOffset of [0, -1]) {
                    const candidate = new Date(Date.UTC(
                        now.getUTCFullYear(),
                        now.getUTCMonth(),
                        now.getUTCDate() + dayOffset,
                        hour, minute, 0, 0
                    ));
                    if (candidate <= now && (latest === null || candidate > latest)) {
                        latest = candidate;
                    }
                }
            }
            return latest;
        }

        // update_time は JST の "YYYY-MM-DD HH:MM:SS"。
        // Safari はこの形式をパースできないため明示的に +09:00 を付ける。
        function parseUpdateTime(data) {
            if (data.update_time_iso) {
                const t = new Date(data.update_time_iso);
                if (!isNaN(t)) return t;
            }
            if (typeof data.update_time === 'string') {
                const t = new Date(data.update_time.replace(' ', 'T') + '+09:00');
                if (!isNaN(t)) return t;
            }
            return null;
        }

        function setNotice(id, text) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.classList.toggle('visible', Boolean(text));
        }

        function updateStaleBanner(data, statusDot) {
            const t = parseUpdateTime(data);
            if (!t) {
                setNotice('staleBanner', '');
                statusDot.classList.remove('stale');
                return;
            }

            const now = new Date();
            // Only consider runs whose grace period has expired. A new scheduled
            // run must not hide an already missed earlier run.
            const expected = lastExpectedRun(new Date(now.getTime() - GRACE_MS));
            const missed = expected !== null && t < expected;

            if (missed) {
                const ageMin = Math.floor((now - t) / (60 * 1000));
                const age = ageMin >= 120
                    ? '約' + Math.floor(ageMin / 60) + '時間'
                    : ageMin + '分';
                setNotice('staleBanner',
                    '⚠️ 定期取得が実行されていない可能性があります。' +
                    'データは' + age + '前のものです。');
                statusDot.classList.add('stale');
            } else {
                setNotice('staleBanner', '');
                statusDot.classList.remove('stale');
            }
        }

        // 5分ごと / タブ復帰時の再描画で、開いていた路線が閉じないよう路線名で覚えておく
        const expandedLines = new Set();
        // 最後に取得できたデータ。地下などで一時的に取得に失敗しても表示を消さないために使う
        let lastData = null;
        let activeRequest = null;
        let renderedContent = null;

        function replaceContent(html) {
            if (html === renderedContent) return;
            const content = document.getElementById('content');
            const focused = document.activeElement instanceof Element ? document.activeElement : null;
            const oldItems = Array.from(content.querySelectorAll('.line-item'));
            const focusedItem = focused ? focused.closest('.line-item') : null;
            const focusedIndex = focusedItem ? oldItems.indexOf(focusedItem) : -1;
            const control = focused && focused.matches('.line-link') ? '.line-link' : '.line-header';

            content.innerHTML = html;
            renderedContent = html;

            // Restore only focus that was inside a replaced card, without scrolling.
            if (focusedIndex !== -1) {
                const items = Array.from(content.querySelectorAll('.line-item'));
                const sameItem = items.find(item => item.dataset.line === focusedItem.dataset.line);
                const nextItem = items[Math.min(focusedIndex, items.length - 1)];
                const target = sameItem?.querySelector(control) || nextItem?.querySelector('.line-header');
                if (target) {
                    target.focus({ preventScroll: true });
                } else {
                    content.tabIndex = -1;
                    content.focus({ preventScroll: true });
                }
            }
        }

        // Yahoo! の https URL 以外はリンクにしない
        function safeDetailUrl(url) {
            return typeof url === 'string' && url.startsWith('https://transit.yahoo.co.jp/')
                ? url
                : DEFAULT_DETAIL_URL;
        }

        function renderIssue(issue) {
            const line = issue.line || '';
            const expanded = expandedLines.has(line);
            return `
                <div class="line-item${expanded ? ' expanded' : ''}" data-line="${escapeHtml(line)}">
                    <button type="button" class="line-header" aria-expanded="${expanded}">
                        <span class="line-icon" aria-hidden="true">🚃</span>
                        <span class="line-name">${escapeHtml(line)}</span>
                        <span class="line-status ${getStatusClass(issue.status)}">${escapeHtml(issue.status || '情報あり')}</span>
                        <svg class="expand-indicator" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true">
                            <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="line-detail">${escapeHtml(issue.detail)}</div>
                    <div class="line-footer">
                        <a href="${escapeHtml(safeDetailUrl(issue.url))}" target="_blank" rel="noopener noreferrer" class="line-link">
                            Yahoo!路線情報で詳細を確認 ↗
                        </a>
                    </div>
                </div>
            `;
        }

        function render(data) {
            if (!data || typeof data !== 'object') {
                throw new Error('データ形式が不正です');
            }
            const statusDot = document.getElementById('statusDot');
            const issues = Array.isArray(data.issues) ? data.issues : [];
            const issueCount = issues.length;

            document.getElementById('updateTime').textContent =
                issueCount > 0 ? `${issueCount}件の運行情報` : '正常';
            document.getElementById('fetchTime').textContent = data.update_time || '不明';
            updateStaleBanner(data, statusDot);

            // lines.json の路線名が Yahoo! 側で見つからない = 改名などで監視から漏れている
            const unmatched = Array.isArray(data.unmatched_lines) ? data.unmatched_lines : [];
            setNotice('unmatchedNotice', unmatched.length
                ? `ℹ️ Yahoo!上で見つからない監視対象路線があります（改名の可能性）: ${unmatched.join('、')}`
                : '');

            const totalLines = Number(data.monitored_lines_count) || 0;
            const matchedLines = Math.max(0, totalLines - unmatched.length);
            const monitoredLabel = unmatched.length > 0
                ? `監視中: ${matchedLines}/${totalLines}路線`
                : `監視中: ${totalLines}路線`;

            if (data.status === 'all_clear' || issueCount === 0) {
                statusDot.classList.remove('has-issues');
                replaceContent(`
                    <div class="all-clear">
                        <div class="all-clear-icon">✅</div>
                        <div class="all-clear-text">全線正常運転中</div>
                        <div style="margin-top: 0.5rem; font-size: 11px;">${monitoredLabel}</div>
                    </div>
                `);
                return;
            }

            statusDot.classList.add('has-issues');
            replaceContent(`
                <div class="status-summary has-issues">
                    <div class="summary-text">⚠️ ${issueCount}件の運行情報があります</div>
                </div>
                <div class="line-list">
                    ${issues.map(renderIssue).join('')}
                </div>
            `);
        }

        function formatLoadError(error, aborted) {
            if (aborted) return 'データの取得がタイムアウトしました';
            const msg = error && typeof error.message === 'string' ? error.message : '';
            if (!msg || error instanceof TypeError || /^(Failed to fetch|Load failed|NetworkError)/i.test(msg)) {
                return '通信エラーが発生しました';
            }
            return msg;
        }

        async function loadTransitData() {
            if (lastData) updateStaleBanner(lastData, document.getElementById('statusDot'));
            if (activeRequest) {
                if (Date.now() - activeRequest.startedAt < FETCH_TIMEOUT_MS) return;
                // Timers can pause while Safari is suspended. Check wall time on return.
                activeRequest.controller.abort();
            }
            const request = { controller: new AbortController(), startedAt: Date.now() };
            activeRequest = request;
            const timeout = setTimeout(() => request.controller.abort(), FETCH_TIMEOUT_MS);
            try {
                const response = await fetch(DATA_URL + '?t=' + Date.now(), {
                    signal: request.controller.signal,
                    cache: 'no-store',
                });
                if (!response.ok) throw new Error('データを取得できませんでした');

                const data = await response.json();
                if (activeRequest !== request) return;
                render(data);
                lastData = data;
                setNotice('fetchErrorNotice', '');
            } catch (error) {
                if (activeRequest !== request) return;
                if (lastData) {
                    // 前回の表示は残し、取得失敗だけを知らせる
                    setNotice('fetchErrorNotice',
                        '⚠️ 最新データを取得できませんでした。前回取得分を表示しています。');
                    updateStaleBanner(lastData, document.getElementById('statusDot'));
                } else {
                    const message = formatLoadError(error, request.controller.signal.aborted);
                    document.getElementById('updateTime').textContent = '取得失敗';
                    document.getElementById('statusDot').classList.add('stale');
                    replaceContent(`
                        <div class="error-message">
                            ⚠️ ${escapeHtml(message)}<br>
                            <small>電波状況を確認して再試行してください</small><br>
                            <button type="button" class="retry-button">再試行</button>
                        </div>
                    `);
                }
            } finally {
                clearTimeout(timeout);
                if (activeRequest === request) activeRequest = null;
            }
        }

        // 属性値にも埋め込むため、引用符までエスケープする
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text).replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
            })[ch]);
        }

        // カードのどこをクリック/タップしても開閉する（リンク・再試行ボタンは除く）
        document.getElementById('content').addEventListener('click', (event) => {
            if (event.target.closest('.retry-button')) {
                loadTransitData();
                return;
            }
            if (event.target.closest('a')) return;
            const item = event.target.closest('.line-item');
            if (!item) return;
            // Mac でこのカード内の本文をドラッグ選択してコピーしようとしたときは閉じない
            const selection = window.getSelection ? window.getSelection() : null;
            if (!event.target.closest('.line-header') && selection && String(selection) && item.contains(selection.anchorNode)) {
                return;
            }

            const expanded = item.classList.toggle('expanded');
            item.querySelector('.line-header').setAttribute('aria-expanded', String(expanded));
            if (expanded) {
                expandedLines.add(item.dataset.line);
            } else {
                expandedLines.delete(item.dataset.line);
            }
        });

        // Initial load
        loadTransitData();

        // Auto reload on tab/window visibility change (e.g. waking up Mac)
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                loadTransitData();
            }
        });

        // Auto refresh every 5 minutes (backup interval)
        setInterval(loadTransitData, 5 * 60 * 1000);
    </script>
</body>

</html>
